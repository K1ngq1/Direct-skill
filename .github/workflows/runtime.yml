name: Public runtime validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  runtime:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python distribution/public_files.py
      - run: node storyboard-workbench/scripts/runtime.mjs doctor
      - run: python distribution/build.py --output release/direct-skill.zip
